<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14111f">
<title>Dosti Buddy</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14111f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:#2b2740;color:#fff}
button.pri{background:linear-gradient(135deg,#7c4dff,#ff4d8d);font-weight:700}
input{font:inherit;border:1px solid #3a3556;border-radius:12px;padding:12px;background:#1e1a30;color:#fff;width:100%}
#lobby{display:flex;flex-direction:column;gap:12px;padding:24px;max-width:420px;margin:0 auto;min-height:100%;justify-content:center}
#lobby h1{margin:0;font-size:28px}
#lobby p{margin:0;color:#aaa;font-size:14px}
.row{display:flex;gap:8px}
#app{display:none;height:100dvh;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1b1730;font-size:13px}
#top .code{font-weight:700;letter-spacing:2px;background:#2b2740;padding:4px 8px;border-radius:8px}
#status{flex:1;color:#9fe8b0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#stage{position:relative;background:#000;flex:0 0 auto;width:100%;aspect-ratio:16/9}
#yt,#vid{position:absolute;inset:0;width:100%;height:100%}
#vid{display:none;background:#000}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#888;padding:20px;font-size:14px}
#cams{position:absolute;right:6px;bottom:6px;display:flex;gap:6px;z-index:5}
#cams video{width:84px;height:112px;object-fit:cover;border-radius:10px;background:#222;border:2px solid #7c4dff}
#cams video.me{border-color:#ff4d8d}
#bar{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#1b1730}
#bar button{white-space:nowrap;padding:8px 12px;font-size:14px}
#brk{background:#e53935;font-weight:700}
#src{display:flex;gap:6px;padding:6px 8px;background:#14111f}
#src input{padding:8px}
#chat{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.m{max-width:80%;padding:7px 11px;border-radius:14px;background:#2b2740;align-self:flex-start;word-break:break-word}
.m.me{align-self:flex-end;background:#5b3fd1}
.m.big{font-size:44px;background:none;padding:0}
.m.sys{align-self:center;background:none;color:#888;font-size:12px}
#emo{display:none;padding:6px 8px;gap:4px;flex-wrap:wrap;background:#1b1730}
#emo span{font-size:28px;padding:2px 5px}
#emo.st span{font-size:46px}
#in{display:flex;gap:6px;padding:8px;background:#1b1730;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#in input{flex:1}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:22px}
#fly{position:fixed;left:0;right:0;bottom:30%;text-align:center;font-size:90px;pointer-events:none;z-index:15;opacity:0}
#fly.go{animation:fl 1.6s ease-out}
@keyframes fl{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-220px) scale(1.4)}}
</style></head><body>
<div id="lobby">
  <h1>🎬 Dosti Buddy</h1>
  <p>Dost ke saath video call + saath mein YouTube/video dekho. Free.</p>
  <input id="name" placeholder="Tumhara naam" maxlength="16">
  <button class="pri" id="mk">Naya room banao</button>
  <p style="text-align:center">ya dost ka code daalo</p>
  <div class="row"><input id="jc" placeholder="CODE" maxlength="4" style="text-transform:uppercase"><button class="pri" id="jn">Join</button></div>
  <p id="lerr" style="color:#ff8a80"></p>
</div>
<div id="app">
  <div id="top"><span class="code" id="code"></span><span id="status">Dost ka wait...</span><button id="cp">Link copy</button></div>
  <div id="stage">
    <div id="yt"></div><video id="vid" playsinline controls></video>
    <div id="empty">Neeche YouTube link daalo ya apni video file chuno</div>
    <div id="cams"><video id="rv" autoplay playsinline></video><video id="lv" class="me" autoplay playsinline muted></video></div>
  </div>
  <div id="src"><input id="yurl" placeholder="YouTube link paste karo"><button class="pri" id="yg">Chalao</button><button id="fb">📁</button><input type="file" id="ff" accept="video/*" hidden></div>
  <div id="bar"><button id="brk">⏸ Break</button><button id="mic">🎤 Mic</button><button id="cam">📷 Cam</button><button id="emb">😀</button><button id="stb">🎉 Stickers</button></div>
  <div id="emo"></div>
  <div id="chat"></div>
  <div id="in"><input id="msg" placeholder="Message likho..." autocomplete="off"><button class="pri" id="send">➤</button></div>
</div>
<div id="overlay"><div id="obt"></div><button class="pri" id="resume">▶ Dono resume karo</button></div>
<div id="fly"></div>
<script>
const $=id=>document.getElementById(id);
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},
 {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]};
let peer,conn,call,local,myName='',isHost=false,code='',ytp=null,mode='none',quiet=false,micOn=true,camOn=true,peerName='Dost';
const EMO='😀😂🤣😍😎😭😡👍🙏🔥❤️🎉😮🤔😴🙌💀🍿'.match(/\p{Extended_Pictographic}\uFE0F?/gu);
const STK=['🍿','🎬','😂','🤣','😭','❤️','🔥','👏','😱','🥳','💀','🙈'];
function fill(el,list){list.forEach(e=>{const s=document.createElement('span');s.textContent=e;s.onclick=()=>{if(el.classList.contains('st'))sendSticker(e);else{$('msg').value+=e;}};el.appendChild(s)})}
function sys(t){add(t,'sys')}
function add(t,c){const d=document.createElement('div');d.className='m '+(c||'');d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e9}
function send(o){if(conn&&conn.open)conn.send(o)}
function sendMsg(){const v=$('msg').value.trim();if(!v)return;add(v,'me');send({t:'chat',v});$('msg').value=''}
function sendSticker(e){add(e,'me big');send({t:'stk',v:e});fly(e)}
function fly(e){const f=$('fly');f.textContent=e;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
$('send').onclick=sendMsg;$('msg').onkeydown=e=>{if(e.key==='Enter')sendMsg()};
fill($('emo'),EMO);
$('emb').onclick=()=>{const e=$('emo');if(e.classList.contains('st')||e.style.display!=='flex'){e.innerHTML='';e.classList.remove('st');fill(e,EMO);e.style.display='flex'}else e.style.display='none'};
$('stb').onclick=()=>{const e=$('emo');e.innerHTML='';e.classList.add('st');fill(e,STK);e.style.display=(e.style.display==='flex'&&e.dataset.k==='s')?'none':'flex';e.dataset.k='s'};
async function media(){try{local=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:480,height:640},audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){try{local=await navigator.mediaDevices.getUserMedia({audio:true});camOn=false}catch(e2){local=new MediaStream();sys('Camera/mic allow nahi hua - sirf chat chalega')}}$('lv').srcObject=local}
function start(host){myName=$('name').value.trim()||'Main';isHost=host;$('lerr').textContent='';
 if(host)code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
 else{code=$('jc').value.trim().toUpperCase();if(code.length!==4){$('lerr').textContent='4 letter ka code daalo';return}}
 media().then(()=>{
  peer=new Peer(host?'wtog-'+code:undefined,{config:ICE});
  peer.on('error',e=>{if(e.type==='unavailable-id'){$('lerr').textContent='Code busy, dobara try karo';location.reload()}else if(e.type==='peer-unavailable'){sys('Room nahi mila. Code check karo.');$('status').textContent='Room nahi mila'}else sys('Error: '+e.type)});
  peer.on('open',()=>{showApp();if(!host){conn=peer.connect('wtog-'+code,{reliable:true});setupConn();call=peer.call('wtog-'+code,local);setupCall()}});
  if(host){peer.on('connection',c=>{conn=c;setupConn()});peer.on('call',c=>{call=c;c.answer(local);setupCall()})}
 })}
function showApp(){$('lobby').style.display='none';$('app').style.display='flex';$('code').textContent=code;history.replaceState(null,'','?room='+code)}
function setupCall(){call.on('stream',s=>{$('rv').srcObject=s;$('rv').play&&$('rv').play().catch(()=>{})})}
function setupConn(){conn.on('open',()=>{$('status').textContent='Connected ✓';send({t:'hi',n:myName});sys('Connected!')});
 conn.on('close',()=>{$('status').textContent='Dost chala gaya';sys(peerName+' disconnect ho gaya')});
 conn.on('data',onData)}
function onData(d){switch(d.t){
 case'hi':peerName=d.n;$('status').textContent=peerName+' ke saath ✓';if(isHost&&mode!=='none')send(cur());break;
 case'chat':add(peerName+': '+d.v);break;
 case'stk':add(d.v,'big');fly(d.v);break;
 case'load':loadRemote(d);break;
 case'ps':applyPlay(d);break;
 case'brk':showBreak(d.n);break;
 case'res':hideBreak(true);break;
 case'fileid':sys(peerName+' ne file chuni: '+d.name+'. Tum bhi wahi file chuno (📁).');break}}
// ---- YouTube ----
function ytId(u){const m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);return m&&m[1]}
let ytReady=false,pend=null;
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(pend){mkYT(pend.id,pend.t,pend.play);pend=null}};
function mkYT(id,t,play){mode='yt';$('vid').style.display='none';$('empty').style.display='none';$('yt').style.display='block';
 quiet=true;
 if(ytp&&ytp.loadVideoById){ytp.loadVideoById({videoId:id,startSeconds:t||0});if(!play)setTimeout(()=>ytp.pauseVideo(),600);setTimeout(()=>quiet=false,1500);ytId_=id;return}
 const holder=document.createElement('div');holder.id='ytp';$('yt').innerHTML='';$('yt').appendChild(holder);ytId_=id;
 ytp=new YT.Player('ytp',{width:'100%',height:'100%',videoId:id,playerVars:{playsinline:1,start:t|0,rel:0},events:{onReady:()=>{if(play)ytp.playVideo();setTimeout(()=>quiet=false,1200)},onStateChange:e=>{if(quiet)return;if(e.data===1||e.data===2)send({t:'ps',p:e.data===1,c:ytp.getCurrentTime()})}}})}
let ytId_='';
$('yg').onclick=()=>{const id=ytId($('yurl').value.trim());if(!id){sys('Sahi YouTube link daalo');return}$('yurl').value='';
 if(!ytReady){pend={id,t:0,play:true}}else mkYT(id,0,true);send({t:'load',k:'yt',id});sys('YouTube video lagayi')};
// ---- local file ----
$('fb').onclick=()=>$('ff').click();
$('ff').onchange=e=>{const f=e.target.files[0];if(!f)return;setFile(f);send({t:'fileid',name:f.name});send({t:'load',k:'file',name:f.name})};
function setFile(f){mode='file';$('empty').style.display='none';$('yt').style.display='none';if(ytp&&ytp.pauseVideo)try{ytp.pauseVideo()}catch(e){};const v=$('vid');v.style.display='block';v.src=URL.createObjectURL(f);sys('File: '+f.name)}
['play','pause'].forEach(ev=>$('vid').addEventListener(ev,()=>{if(quiet)return;send({t:'ps',p:ev==='play',c:$('vid').currentTime})}));
$('vid').addEventListener('seeked',()=>{if(!quiet)send({t:'ps',p:!$('vid').paused,c:$('vid').currentTime})});
function loadRemote(d){if(d.k==='yt'){if(!ytReady)pend={id:d.id,t:0,play:true};else mkYT(d.id,0,true);sys(peerName+' ne YouTube video lagayi')}else{sys(peerName+' ne file chuni: '+d.name+'. Tum bhi wahi file chuno (📁).')}}
function cur(){return mode==='yt'?{t:'load',k:'yt',id:ytId_}:{t:'x'}}
function applyPlay(d){quiet=true;setTimeout(()=>quiet=false,900);
 if(mode==='yt'&&ytp&&ytp.getCurrentTime){if(Math.abs(ytp.getCurrentTime()-d.c)>1.5)ytp.seekTo(d.c,true);d.p?ytp.playVideo():ytp.pauseVideo()}
 else if(mode==='file'){const v=$('vid');if(Math.abs(v.currentTime-d.c)>1.5)v.currentTime=d.c;d.p?v.play().catch(()=>{}):v.pause()}}
function pauseAll(){quiet=true;setTimeout(()=>quiet=false,900);if(mode==='yt'&&ytp&&ytp.pauseVideo)ytp.pauseVideo();if(mode==='file')$('vid').pause()}
// ---- break ----
function showBreak(n){pauseAll();$('obt').textContent='☕ '+n+' ne Break liya. Dono ki video ruki hai.';$('overlay').style.display='flex'}
function hideBreak(remote){$('overlay').style.display='none';if(!remote)send({t:'res'})}
$('brk').onclick=()=>{showBreak('Tumne');send({t:'brk',n:myName})};
$('resume').onclick=()=>{hideBreak(false);quiet=true;setTimeout(()=>quiet=false,900);if(mode==='yt'&&ytp)ytp.playVideo();if(mode==='file')$('vid').play().catch(()=>{})};
// ---- controls ----
$('mic').onclick=()=>{micOn=!micOn;local.getAudioTracks().forEach(t=>t.enabled=micOn);$('mic').textContent=micOn?'🎤 Mic':'🔇 Mic off'};
$('cam').onclick=()=>{camOn=!camOn;local.getVideoTracks().forEach(t=>t.enabled=camOn);$('cam').textContent=camOn?'📷 Cam':'🚫 Cam off'};
$('cp').onclick=()=>{const u=location.origin+location.pathname+'?room='+code;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>$('cp').textContent='Copied ✓').catch(()=>prompt('Link copy karo',u))};
$('mk').onclick=()=>start(true);$('jn').onclick=()=>start(false);
const q=new URLSearchParams(location.search).get('room');if(q){$('jc').value=q}
</script></body></html>
